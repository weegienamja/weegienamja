<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc">
<title id="title">Jamie Blair — systems, networks and applied AI</title>
<desc id="desc">Live GitHub profile telemetry generated from Jamie Blair's public repositories.</desc>
<defs>
  <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
    <stop offset="0" stop-color="#06080B"/><stop offset="1" stop-color="#0A0F15"/>
  </linearGradient>
  <linearGradient id="accentLine" x1="0" x2="1">
    <stop offset="0" stop-color="#55C7FF" stop-opacity=".05"/>
    <stop offset=".5" stop-color="#55C7FF" stop-opacity=".9"/>
    <stop offset="1" stop-color="#70E1C8" stop-opacity=".05"/>
  </linearGradient>
  <radialGradient id="glow" cx="50%" cy="50%" r="50%">
    <stop offset="0" stop-color="#55C7FF" stop-opacity=".16"/><stop offset="1" stop-color="#55C7FF" stop-opacity="0"/>
  </radialGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
    <path d="M32 0H0V32" fill="none" stroke="#8AA0B5" stroke-opacity=".055"/>
  </pattern>
  <clipPath id="frameClip"><rect x="28" y="28" width="1144" height="634" rx="26"/></clipPath>
  <style>
    .sans{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.mono{font-family:"SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace}.hero{font-size:58px;font-weight:700;letter-spacing:-2px;fill:#F4F7FA}.kicker{font-size:13px;font-weight:650;letter-spacing:2.4px;fill:#7F94A8}.lede{font-size:21px;font-weight:430;fill:#B9C5D0}.small{font-size:13px}.tiny{font-size:11px;letter-spacing:.9px}.muted{fill:#7F94A8}.accent{fill:#75D7FF}.project{font-size:18px;font-weight:650;fill:#EFF5F8}.metric{font-size:24px;font-weight:650;fill:#EEF5F8}.metricLabel{font-size:10px;letter-spacing:1.3px;fill:#6F8294}@media(prefers-reduced-motion:reduce){.motion{display:none}}
  </style>
</defs>
<rect width="1200" height="690" fill="url(#bg)"/>
<rect width="1200" height="690" fill="url(#grid)"/>
<circle cx="930" cy="135" r="300" fill="url(#glow)"/>
<rect x="28" y="28" width="1144" height="634" rx="26" fill="none" stroke="#1B2530"/>
<g clip-path="url(#frameClip)" class="motion" opacity=".55">
  <rect x="-260" y="28" width="180" height="634" fill="url(#accentLine)" opacity=".08"><animate attributeName="x" from="-260" to="1280" dur="11s" repeatCount="indefinite"/></rect>
</g>
<text x="78" y="82" class="mono kicker">JAMIE BLAIR / ENGINEERING PROFILE</text>
<text x="78" y="154" class="sans hero">Systems that make</text>
<text x="78" y="216" class="sans hero">infrastructure legible.</text>
<text x="78" y="262" class="sans lede">Networks · automation · applied AI · product systems</text>

<g transform="translate(786 72)">
  <rect width="336" height="214" rx="20" fill="#0A1016" stroke="#1E2A36"/>
  <text x="22" y="34" class="mono tiny muted">LIVE / PUBLIC REPOSITORY TELEMETRY</text>
  <path d="M24 95C75 61 119 128 171 92S267 50 312 87" fill="none" stroke="#2C4659" stroke-width="1.2"/>
  <path d="M24 150C86 131 123 154 165 126S247 119 312 150" fill="none" stroke="#203746" stroke-width="1.2"/>
  <g class="motion">
    <circle r="4" fill="#75D7FF"><animateMotion path="M24 95C75 61 119 128 171 92S267 50 312 87" dur="5.8s" repeatCount="indefinite"/></circle>
    <circle r="3" fill="#70E1C8"><animateMotion path="M24 150C86 131 123 154 165 126S247 119 312 150" dur="7.2s" repeatCount="indefinite"/></circle>
  </g>
  <circle cx="24" cy="95" r="4" fill="#55C7FF"/><circle cx="171" cy="92" r="4" fill="#55C7FF"/><circle cx="312" cy="87" r="4" fill="#70E1C8"/>
  <text x="24" y="189" class="mono tiny muted">LATEST PUSH</text>
  <text x="312" y="189" text-anchor="end" class="mono tiny accent">SWITCH-OPS · TODAY</text>
</g>

<g transform="translate(78 316)">
  <line x1="0" y1="0" x2="1044" y2="0" stroke="#1B2732"/>
  <g transform="translate(0 34)"><text class="mono metricLabel">PUBLIC SYSTEMS</text><text y="29" class="sans metric">8</text></g>
  <g transform="translate(190 34)"><text class="mono metricLabel">ACTIVE / 30D</text><text y="29" class="sans metric">5</text></g>
  <g transform="translate(365 34)"><text class="mono metricLabel">FEATURED LANGUAGES</text><text y="29" class="sans metric">2</text></g>
  <g transform="translate(584 34)"><text class="mono metricLabel">DISCOVERY MODE</text><text y="29" class="sans metric" fill="#70E1C8">AUTO</text></g>
  <text x="1044" y="53" text-anchor="end" class="mono tiny muted">SYNCED FROM GITHUB API</text>
</g>

  <g transform="translate(78 402)">
    <rect width="486" height="104" rx="18" fill="#0B1017" stroke="#1C2734"/>
    <text x="20" y="27" class="mono tiny muted">01 / TYPESCRIPT</text>
    <text x="20" y="55" class="sans project">Switch-Ops</text>
    <text x="20" y="80" class="sans small muted">Network discovery and operations tooling for Cisco infrastructure.</text>
    <text x="392" y="27" text-anchor="end" class="mono tiny accent">V0.8</text>
    <circle cx="452" cy="23" r="4" fill="#70E1C8"><animate attributeName="opacity" values=".35;1;.35" dur="3.4s" repeatCount="indefinite"/></circle>
  </g>
  <g transform="translate(600 402)">
    <rect width="486" height="104" rx="18" fill="#0B1017" stroke="#1C2734"/>
    <text x="20" y="27" class="mono tiny muted">02 / TYPESCRIPT</text>
    <text x="20" y="55" class="sans project">Faultline-Network-Diagnostics</text>
    <text x="20" y="80" class="sans small muted">Local-first network investigation, diagnostics and change assurance.</text>
    <text x="392" y="27" text-anchor="end" class="mono tiny accent">TODAY</text>
    <circle cx="452" cy="23" r="4" fill="#70E1C8"><animate attributeName="opacity" values=".35;1;.35" dur="3.95s" repeatCount="indefinite"/></circle>
  </g>
  <g transform="translate(78 530)">
    <rect width="486" height="104" rx="18" fill="#0B1017" stroke="#1C2734"/>
    <text x="20" y="27" class="mono tiny muted">03 / PYTHON</text>
    <text x="20" y="55" class="sans project">sdwan-mcp-server</text>
    <text x="20" y="80" class="sans small muted">Deterministic MCP tooling for investigating Cisco SD-WAN telemetry.</text>
    <text x="392" y="27" text-anchor="end" class="mono tiny accent">1D AGO</text>
    <circle cx="452" cy="23" r="4" fill="#70E1C8"><animate attributeName="opacity" values=".35;1;.35" dur="4.5s" repeatCount="indefinite"/></circle>
  </g>
  <g transform="translate(600 530)">
    <rect width="486" height="104" rx="18" fill="#0B1017" stroke="#1C2734"/>
    <text x="20" y="27" class="mono tiny muted">04 / TYPESCRIPT</text>
    <text x="20" y="55" class="sans project">WindForge</text>
    <text x="20" y="80" class="sans small muted">Wind infrastructure site screening built around geospatial constraints…</text>
    <text x="392" y="27" text-anchor="end" class="mono tiny accent">3D AGO</text>
    <circle cx="452" cy="23" r="4" fill="#70E1C8"><animate attributeName="opacity" values=".35;1;.35" dur="5.05s" repeatCount="indefinite"/></circle>
  </g>
<text x="78" y="652" class="mono tiny muted">GLASGOW, SCOTLAND</text>
<text x="1122" y="652" text-anchor="end" class="mono tiny muted">github.com/weegienamja</text>
</svg>