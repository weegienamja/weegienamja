<svg xmlns="http://www.w3.org/2000/svg" width="960" height="176" viewBox="0 0 960 176" role="img" aria-labelledby="title desc">
  <title id="title">Jamie Blair</title>
  <desc id="desc">A dark teal nameplate with a drawing of a network switch and two connected patch cables.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="0" gradientUnits="objectBoundingBox">
      <stop stop-color="#0d2023"/>
      <stop offset="1" stop-color="#123238"/>
    </linearGradient>
    <pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="8" cy="8" r="0.95" fill="#96c3bb" opacity=".22"/>
    </pattern>
    <g id="port" stroke-linejoin="round">
      <path d="M0 0h21v12h-5v3H5v-3H0z" fill="#0a1c20" stroke="#78aaa3" stroke-width="1.3"/>
      <path d="M4 3v3m3-3v3m3-3v3m3-3v3m3-3v3" stroke="#a1bbb2" stroke-width="1"/>
    </g>
    <g id="vents" fill="none" stroke="#49706f" stroke-width="2" stroke-linecap="round">
      <path d="m0 0 15-9m-3 9 15-9m-3 9 15-9m-3 9 15-9m-3 9 15-9m-3 9 15-9"/>
    </g>
    <style>
      @media (prefers-reduced-motion: no-preference) {
        .link-light { animation: activity 4s steps(1, end) infinite; }
        @keyframes activity {
          0%, 68%, 78%, 100% { opacity: 1; }
          72%, 82% { opacity: .35; }
        }
      }
    </style>
  </defs>

  <rect width="960" height="176" rx="10" fill="url(#background)"/>
  <svg x="516" y="0" width="444" height="176" viewBox="0 0 444 176" fill="none">
    <rect x="12" y="12" width="420" height="152" fill="url(#dots)"/>
    <!-- Switch enclosure, vents and front panel. -->
    <g stroke-linejoin="round" stroke-width="1.6">
      <path d="m70 74 55-33h204l-55 33z" fill="#315556" stroke="#8eb8ad"/>
      <path d="m274 74 55-33v38l-55 33z" fill="#143337" stroke="#78a199"/>
      <path d="M70 74h204v38H70z" fill="#254448" stroke="#9abbaf"/>
    </g>
    <use href="#vents" x="144" y="63"/>
    <g fill="#bdd6c8">
      <circle cx="81" cy="88" r="2.2"/>
      <circle cx="81" cy="97" r="2.2" fill="#6bd7be" class="link-light"/>
    </g>
    <g>
      <use href="#port" x="97" y="85"/>
      <use href="#port" x="125" y="85"/>
      <use href="#port" x="153" y="85"/>
      <use href="#port" x="181" y="85"/>
      <use href="#port" x="209" y="85"/>
      <use href="#port" x="237" y="85"/>
    </g>
    <!-- Two seated patch leads, shown at their actual ports. -->
    <g stroke-linecap="round" stroke-linejoin="round">
      <path d="M135 102v19q0 16 16 16h126q17 0 30 13l29 29" stroke="#0c282c" stroke-width="9"/>
      <path d="M135 102v19q0 16 16 16h126q17 0 30 13l29 29" stroke="#58bba9" stroke-width="5"/>
      <path d="M219 102v13q0 10 11 10h55q20 0 33-13l21-21q12-12 30-12h43" stroke="#0c282c" stroke-width="9"/>
      <path d="M219 102v13q0 10 11 10h55q20 0 33-13l21-21q12-12 30-12h43" stroke="#a6cdbb" stroke-width="5"/>
    </g>
    <g stroke-width="1.3" stroke-linejoin="round">
      <path d="M128 88h14v12l-3 6h-8l-3-6z" fill="#438b81" stroke="#a4e0cb"/>
      <path d="M212 88h14v12l-3 6h-8l-3-6z" fill="#88ad9f" stroke="#d0e2ce"/>
      <path d="M131 92h8m-8 4h8m76-4h8m-8 4h8" stroke="#254b49"/>
    </g>
  </svg>
  <text x="46" y="115" fill="#eff6ee" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="78" font-weight="650" letter-spacing="-3.2">Jamie Blair</text>
</svg>
