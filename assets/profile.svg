<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="728" viewBox="0 0 1200 728" role="img" aria-labelledby="title desc">
<title id="title">Jamie Blair | systems, networks and applied AI</title>
<desc id="desc">Live GitHub profile telemetry generated from Jamie Blair's public repositories.</desc>
<defs>
  <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
    <stop offset="0" stop-color="#06080B"/><stop offset="1" stop-color="#0A0F15"/>
  </linearGradient>
  <linearGradient id="accentLine" x1="0" x2="1">
    <stop offset="0" stop-color="#55C7FF" stop-opacity=".05"/>
    <stop offset=".5" stop-color="#55C7FF" stop-opacity=".9"/>
    <stop offset="1" stop-color="#70E1C8" stop-opacity=".05"/>
  </linearGradient>
  <radialGradient id="glow" cx="50%" cy="50%" r="50%">
    <stop offset="0" stop-color="#55C7FF" stop-opacity=".16"/><stop offset="1" stop-color="#55C7FF" stop-opacity="0"/>
  </radialGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
    <path d="M32 0H0V32" fill="none" stroke="#8AA0B5" stroke-opacity=".055"/>
  </pattern>
  <clipPath id="frameClip"><rect x="28" y="28" width="1144" height="672" rx="26"/></clipPath>
  <style>
    .sans{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.mono{font-family:"SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace}.hero{font-size:58px;font-weight:700;letter-spacing:-2px;fill:#F4F7FA}.kicker{font-size:13px;font-weight:650;letter-spacing:2.4px;fill:#8FA4B7}.lede{font-size:21px;font-weight:430;fill:#C3CFD9}.description{font-size:14px;font-weight:430;fill:#B8C8D6}.tiny{font-size:12px;letter-spacing:.8px}.muted{fill:#95A9BB}.accent{fill:#75D7FF}.project{font-size:19px;font-weight:650;fill:#F4F8FA}.metric{font-size:24px;font-weight:650;fill:#F4F8FA}.metricLabel{font-size:11px;letter-spacing:1.15px;fill:#879CAF}@media(prefers-reduced-motion:reduce){.motion{display:none}}
  </style>
</defs>
<rect width="1200" height="728" fill="url(#bg)"/>
<rect width="1200" height="728" fill="url(#grid)"/>
<circle cx="930" cy="135" r="300" fill="url(#glow)"/>
<rect x="28" y="28" width="1144" height="672" rx="26" fill="none" stroke="#263644" stroke-width="1.15"/>
<g clip-path="url(#frameClip)" class="motion" opacity=".55">
  <rect x="-260" y="28" width="180" height="672" fill="url(#accentLine)" opacity=".08"><animate attributeName="x" from="-260" to="1280" dur="11s" repeatCount="indefinite"/></rect>
</g>
<text x="78" y="82" class="mono kicker">JAMIE BLAIR / ENGINEERING PROFILE</text>
<text x="78" y="154" class="sans hero">Systems that make</text>
<text x="78" y="216" class="sans hero">infrastructure legible.</text>
<text x="78" y="262" class="sans lede">Networks · automation · applied AI · product systems</text>

<g transform="translate(786 72)">
  <rect width="336" height="214" rx="20" fill="#0C141D" stroke="#2A3A49" stroke-width="1.15"/>
  <text x="22" y="34" class="mono tiny muted">LIVE / PUBLIC REPOSITORY TELEMETRY</text>
  <path d="M24 95C75 61 119 128 171 92S267 50 312 87" fill="none" stroke="#39586D" stroke-width="1.35"/>
  <path d="M24 150C86 131 123 154 165 126S247 119 312 150" fill="none" stroke="#2D4759" stroke-width="1.35"/>
  <g class="motion">
    <circle r="4" fill="#75D7FF"><animateMotion path="M24 95C75 61 119 128 171 92S267 50 312 87" dur="5.8s" repeatCount="indefinite"/></circle>
    <circle r="3" fill="#70E1C8"><animateMotion path="M24 150C86 131 123 154 165 126S247 119 312 150" dur="7.2s" repeatCount="indefinite"/></circle>
  </g>
  <circle cx="24" cy="95" r="4" fill="#55C7FF"/><circle cx="171" cy="92" r="4" fill="#55C7FF"/><circle cx="312" cy="87" r="4" fill="#70E1C8"/>
  <text x="24" y="189" class="mono tiny muted">LATEST PUSH</text>
  <text x="312" y="189" text-anchor="end" class="mono tiny accent">SWITCH-OPS · TODAY</text>
</g>

<g transform="translate(78 316)">
  <line x1="0" y1="0" x2="1044" y2="0" stroke="#273846"/>
  <g transform="translate(0 34)"><text class="mono metricLabel">PUBLIC SYSTEMS</text><text y="30" class="sans metric">9</text></g>
  <g transform="translate(190 34)"><text class="mono metricLabel">ACTIVE / 30D</text><text y="30" class="sans metric">4</text></g>
  <g transform="translate(365 34)"><text class="mono metricLabel">FEATURED LANGUAGES</text><text y="30" class="sans metric">3</text></g>
  <g transform="translate(584 34)"><text class="mono metricLabel">DISCOVERY MODE</text><text y="30" class="sans metric" fill="#70E1C8">AUTO</text></g>
  <text x="1044" y="54" text-anchor="end" class="mono tiny muted">SYNCED FROM GITHUB API</text>
</g>

  <g transform="translate(78 402)">
    <rect width="486" height="124" rx="18" fill="#0D151F" stroke="#273746" stroke-width="1.15"/>
    <text x="20" y="28" class="mono tiny muted">01 / PYTHON</text>
    <text x="20" y="58" class="sans project">Switch-Ops</text>
    <text class="sans description"><tspan x="20" y="87">Local-first Cisco Catalyst operations with live telemetry,</tspan><tspan x="20" y="107">evidence-aware topology, state reconciliation, and safe…</tspan></text>
    <text x="392" y="28" text-anchor="end" class="mono tiny accent">V0.6.0</text>
    <circle cx="452" cy="24" r="4.5" fill="#70E1C8">
      <animate attributeName="opacity" values=".45;1;.45" dur="3.4s" repeatCount="indefinite"/>
    </circle>
  </g>
  <g transform="translate(600 402)">
    <rect width="486" height="124" rx="18" fill="#0D151F" stroke="#273746" stroke-width="1.15"/>
    <text x="20" y="28" class="mono tiny muted">02 / TYPESCRIPT</text>
    <text x="20" y="58" class="sans project">WindForge</text>
    <text class="sans description"><tspan x="20" y="87">Evidence-aware TypeScript tools and a public demo for</tspan><tspan x="20" y="107">preliminary wind-site screening; not a planning…</tspan></text>
    <text x="392" y="28" text-anchor="end" class="mono tiny accent">4D AGO</text>
    <circle cx="452" cy="24" r="4.5" fill="#70E1C8">
      <animate attributeName="opacity" values=".45;1;.45" dur="3.95s" repeatCount="indefinite"/>
    </circle>
  </g>
  <g transform="translate(78 542)">
    <rect width="486" height="124" rx="18" fill="#0D151F" stroke="#273746" stroke-width="1.15"/>
    <text x="20" y="28" class="mono tiny muted">03 / JAVASCRIPT</text>
    <text x="20" y="58" class="sans project">Faultline-Network-Diagnostics</text>
    <text class="sans description"><tspan x="20" y="87">Open-source network troubleshooting and diagnostics for</tspan><tspan x="20" y="107">intermittent connectivity, DNS, IPv4/IPv6, VPN, TLS and…</tspan></text>
    <text x="392" y="28" text-anchor="end" class="mono tiny accent">4D AGO</text>
    <circle cx="452" cy="24" r="4.5" fill="#70E1C8">
      <animate attributeName="opacity" values=".45;1;.45" dur="4.5s" repeatCount="indefinite"/>
    </circle>
  </g>
  <g transform="translate(600 542)">
    <rect width="486" height="124" rx="18" fill="#0D151F" stroke="#273746" stroke-width="1.15"/>
    <text x="20" y="28" class="mono tiny muted">04 / PYTHON</text>
    <text x="20" y="58" class="sans project">sdwan-mcp-server</text>
    <text class="sans description"><tspan x="20" y="87">Active public repository.</tspan></text>
    <text x="392" y="28" text-anchor="end" class="mono tiny accent">4D AGO</text>
    <circle cx="452" cy="24" r="4.5" fill="#70E1C8">
      <animate attributeName="opacity" values=".45;1;.45" dur="5.05s" repeatCount="indefinite"/>
    </circle>
  </g>
<text x="78" y="690" class="mono tiny muted">GLASGOW, SCOTLAND</text>
<text x="1122" y="690" text-anchor="end" class="mono tiny muted">github.com/weegienamja</text>
</svg>